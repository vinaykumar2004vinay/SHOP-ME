<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account — ShopEase</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="navbar"></div>

    <!-- Cart -->
    <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
      <div class="cart-header">
        <h3>Shopping Cart</h3>
        <button class="cart-close-btn" onclick="closeCart()">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="cart-body" id="cartBody"></div>
      <div class="cart-footer" id="cartFooter" style="display: none"></div>
    </div>

    <!-- Page header -->
    <div class="page-header">
      <div class="page-header-inner">
        <h1>My Account</h1>
        <p>Manage your personal information, address and password</p>
      </div>
    </div>

    <div
      class="container"
      style="padding-top: 2rem; padding-bottom: 3rem; max-width: 960px"
    >
      <div
        style="
          display: grid;
          grid-template-columns: 240px 1fr;
          gap: 2rem;
          align-items: start;
        "
      >
        <!-- Sidebar -->
        <div>
          <!-- Avatar card -->
          <div
            class="card card-body"
            style="text-align: center; margin-bottom: 1rem"
          >
            <div
              style="
                width: 72px;
                height: 72px;
                border-radius: 50%;
                background: var(--primary-light);
                border: 2px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 0.8rem;
              "
            >
              <svg
                style="width: 36px; height: 36px; color: var(--primary)"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </div>
            <div
              id="sbName"
              style="
                font-weight: 700;
                color: var(--text-900);
                margin-bottom: 0.2rem;
              "
            >
              —
            </div>
            <div id="sbEmail" style="font-size: 0.8rem; color: var(--text-400)">
              —
            </div>
            <div id="sbRole" style="margin-top: 0.5rem"></div>
            <div
              id="sbSince"
              style="
                font-size: 0.75rem;
                color: var(--text-400);
                margin-top: 0.3rem;
              "
            ></div>
          </div>

          <!-- Nav links -->
          <div class="card" style="overflow: hidden">
            <a
              href="/pages/profile.html"
              style="
                display: flex;
                align-items: center;
                gap: 0.7rem;
                padding: 0.8rem 1rem;
                font-size: 0.875rem;
                font-weight: 600;
                color: var(--primary);
                background: var(--primary-light);
                border-bottom: 1px solid var(--border);
              "
            >
              <svg
                style="width: 16px; height: 16px"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              Profile
            </a>
            <a
              href="/pages/orders.html"
              style="
                display: flex;
                align-items: center;
                gap: 0.7rem;
                padding: 0.8rem 1rem;
                font-size: 0.875rem;
                color: var(--text-700);
                border-bottom: 1px solid var(--border);
                transition: background 0.15s;
              "
            >
              <svg
                style="width: 16px; height: 16px"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"
                />
                <rect x="9" y="3" width="6" height="4" rx="1" />
              </svg>
              My Orders
            </a>
            <a
              href="#"
              onclick="doLogout(event)"
              style="
                display: flex;
                align-items: center;
                gap: 0.7rem;
                padding: 0.8rem 1rem;
                font-size: 0.875rem;
                color: var(--danger);
                transition: background 0.15s;
              "
            >
              <svg
                style="width: 16px; height: 16px"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Sign Out
            </a>
          </div>
        </div>

        <!-- Main content -->
        <div>
          <!-- Edit Profile -->
          <div class="card" style="margin-bottom: 1.5rem">
            <div
              class="card-body"
              style="border-bottom: 1px solid var(--border)"
            >
              <h3>Personal Information</h3>
            </div>
            <div class="card-body">
              <form id="profileForm" onsubmit="saveProfile(event)">
                <div
                  style="
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 1rem;
                  "
                >
                  <div class="form-group">
                    <label>First name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="pfFirst"
                      required
                    />
                  </div>
                  <div class="form-group">
                    <label>Last name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="pfLast"
                      required
                    />
                  </div>
                </div>
                <div class="form-group">
                  <label>Email address</label>
                  <input
                    type="email"
                    class="form-control"
                    id="pfEmail"
                    required
                  />
                </div>
                <div class="form-group">
                  <label
                    >New password
                    <span style="font-weight: 400; color: var(--text-400)"
                      >(leave blank to keep current)</span
                    ></label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="pfPass"
                    placeholder="Enter new password"
                    minlength="6"
                  />
                </div>
                <div class="form-group">
                  <label>Shipping address</label>
                  <textarea
                    class="form-control"
                    id="pfAddr"
                    rows="2"
                    required
                  ></textarea>
                </div>
                <div
                  id="pfErr"
                  style="
                    color: var(--danger);
                    font-size: 0.82rem;
                    margin-bottom: 0.8rem;
                    display: none;
                  "
                ></div>
                <button type="submit" class="btn btn-primary" id="saveBtn">
                  Save Changes
                </button>
              </form>
            </div>
          </div>

          <!-- Recent Orders -->
          <div class="card">
            <div
              class="card-body"
              style="
                border-bottom: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center;
              "
            >
              <h3>Recent Orders</h3>
              <a href="/pages/orders.html" class="btn btn-outline btn-sm"
                >View All</a
              >
            </div>
            <div id="recentOrders">
              <div class="loading-center"><div class="spinner"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-bottom" style="max-width: none; margin: 0">
        <span>© 2026 ShopEase. All rights reserved.</span>
      </div>
    </footer>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/cart.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        requireAuth();
        const u = getUser();
        await Promise.all([loadProfile(u.id), loadRecentOrders(u.id)]);
      });

      async function loadProfile(uid) {
        try {
          const res = await UserAPI.getById(uid);
          const u = res.data;
          document.getElementById("sbName").textContent =
            `${u.firstName} ${u.lastName}`;
          document.getElementById("sbEmail").textContent = u.email;
          document.getElementById("sbRole").innerHTML =
            `<span class="badge badge-primary">${u.role}</span>`;
          document.getElementById("sbSince").textContent =
            "Member since " +
            new Date(u.createdAt).toLocaleDateString("en-IN", {
              month: "long",
              year: "numeric",
            });
          document.getElementById("pfFirst").value = u.firstName;
          document.getElementById("pfLast").value = u.lastName;
          document.getElementById("pfEmail").value = u.email;
          document.getElementById("pfAddr").value = u.shippingAddress || "";
          saveUser(u);
        } catch {
          showToast("Could not load profile", "error");
        }
      }

      async function saveProfile(e) {
        e.preventDefault();
        const btn = document.getElementById("saveBtn");
        const err = document.getElementById("pfErr");
        err.style.display = "none";
        const u = getUser();
        const pass = document.getElementById("pfPass").value;
        const data = {
          firstName: document.getElementById("pfFirst").value.trim(),
          lastName: document.getElementById("pfLast").value.trim(),
          email: document.getElementById("pfEmail").value.trim(),
          shippingAddress: document.getElementById("pfAddr").value.trim(),
        };
        // Only include password in request if user actually typed a new one
        if (pass && pass.trim().length > 0) data.password = pass.trim();
        setLoading(btn, true, "Saving...");
        try {
          const res = await UserAPI.update(u.id, data);
          saveUser(res.data);
          showToast("Profile updated successfully", "success");
          await loadProfile(u.id);
        } catch (ex) {
          err.textContent = ex.message;
          err.style.display = "block";
        } finally {
          setLoading(btn, false);
        }
      }

      async function loadRecentOrders(uid) {
        const el = document.getElementById("recentOrders");
        try {
          const res = await OrderAPI.getUserOrders(uid);
          const orders = (res.data || []).slice(0, 4);
          if (!orders.length) {
            el.innerHTML = `<div style="padding:2rem;text-align:center;color:var(--text-400)">
          <p>No orders yet. <a href="/index.html" style="color:var(--primary)">Start shopping</a></p>
        </div>`;
            return;
          }
          el.innerHTML = orders
            .map(
              (o) => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0.9rem 1.4rem;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-size:0.875rem;font-weight:600;color:var(--text-900)">Order #${o.id}</div>
            <div style="font-size:0.78rem;color:var(--text-400)">${formatDate(o.placedAt)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:1rem">
            ${statusBadge(o.status)}
            <span style="font-weight:700;font-size:0.9rem">${formatPrice(o.totalAmount)}</span>
          </div>
        </div>
      `,
            )
            .join("");
        } catch {
          el.innerHTML = `<div style="padding:1rem;color:var(--text-400);font-size:0.875rem">Could not load orders.</div>`;
        }
      }

      function doLogout(e) {
        e.preventDefault();
        clearUser();
        localStorage.removeItem("cartCount");
        showToast("Signed out successfully", "success");
        setTimeout(() => (window.location.href = "/index.html"), 900);
      }
    </script>
  </body>
</html>
