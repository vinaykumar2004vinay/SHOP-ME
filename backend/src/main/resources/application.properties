# ============================================================
# Application Configuration
# ============================================================
spring.application.name=ecommerce-backend
server.port=8080

# ============================================================
# MySQL Database Configuration
# Update username/password to match your local MySQL setup
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# Hibernate / JPA Configuration
# hibernate.ddl-auto=update => Hibernate auto-creates/updates tables
# This is the key requirement: no manual SQL DDL needed
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect removed — Hibernate 6 auto-detects from JDBC URL; explicit setting causes deprecation warning

# Disable Open-Session-In-View: keep Hibernate session inside @Transactional only.
# With @JsonIgnore and @JsonIgnoreProperties on all entities, lazy fields are
# never accessed outside transactions, so OSIV is not needed.
# Keeping it false prevents silent N+1 queries and makes session scope explicit.
spring.jpa.open-in-view=false

# ============================================================
# CORS: Allow frontend (port 3000) to call backend (port 8080)
# ============================================================
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://127.0.0.1:3000

# ============================================================
# Email Configuration (Gmail SMTP)
# Replace with your Gmail + App Password
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=vinaykumar2004.dasari@gmail.com
spring.mail.password=Vinay@2004
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# Multipart file upload (for product images)
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory path
app.upload.dir=uploads/products

# ============================================================
# Logging
# ============================================================
logging.level.com.ecommerce=DEBUG
logging.level.org.hibernate.SQL=DEBUG
